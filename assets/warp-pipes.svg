<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2"/>
    </filter>
    <g id="peek">
      <rect x="-22" y="-26" width="44" height="30" rx="2" fill="#D2693A" stroke="#2B2118" stroke-width="3"/>
      <rect x="-11" y="-19" width="6" height="12" rx="1" fill="#2B2118"/>
      <rect x="5" y="-19" width="6" height="12" rx="1" fill="#2B2118"/>
    </g>
  </defs>

  <rect width="600" height="200" fill="#EFE7D4" rx="12"/>

  <g filter="url(#wobble)" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" text-anchor="middle">
    <path d="M20 190 H580" stroke="#2B2118" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>

    <text x="300" y="28" font-size="15" fill="#6B5B47">pick a hole, Clawd will pop out ↓</text>

    <!-- Pipe 1: Instagram -->
    <g>
      <g clip-path="inset(0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0,36; 0,-16; 0,-16; 0,36" keyTimes="0;0.25;0.75;1" dur="3s" repeatCount="indefinite"/>
          <use href="#peek" x="110" y="118"/>
        </g>
      </g>
      <rect x="70" y="118" width="80" height="22" rx="4" fill="#D97757" stroke="#2B2118" stroke-width="3"/>
      <rect x="78" y="140" width="64" height="50" fill="#C85F34" stroke="#2B2118" stroke-width="3"/>
      <text x="110" y="172" font-size="16" font-weight="700" fill="#FFFBF0">IG</text>
    </g>

    <!-- Pipe 2: Discord -->
    <g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,36; 0,-16; 0,-16; 0,36" keyTimes="0;0.25;0.75;1" dur="3s" begin="1s" repeatCount="indefinite"/>
        <use href="#peek" x="300" y="118"/>
      </g>
      <rect x="260" y="118" width="80" height="22" rx="4" fill="#D97757" stroke="#2B2118" stroke-width="3"/>
      <rect x="268" y="140" width="64" height="50" fill="#C85F34" stroke="#2B2118" stroke-width="3"/>
      <text x="300" y="172" font-size="16" font-weight="700" fill="#FFFBF0">DC</text>
    </g>

    <!-- Pipe 3: Web -->
    <g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,36; 0,-16; 0,-16; 0,36" keyTimes="0;0.25;0.75;1" dur="3s" begin="2s" repeatCount="indefinite"/>
        <use href="#peek" x="490" y="118"/>
      </g>
      <rect x="450" y="118" width="80" height="22" rx="4" fill="#D97757" stroke="#2B2118" stroke-width="3"/>
      <rect x="458" y="140" width="64" height="50" fill="#C85F34" stroke="#2B2118" stroke-width="3"/>
      <text x="490" y="172" font-size="16" font-weight="700" fill="#FFFBF0">WEB</text>
    </g>
  </g>
</svg>
