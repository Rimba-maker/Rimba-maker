<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.28  0 0 0 0.10 0"/>
    </filter>
    <filter id="wobble" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" seed="2" result="t">
        <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2"/>
    </filter>
    <g id="clawd-mini">
      <ellipse cx="0" cy="40" rx="30" ry="5" fill="#9C93AE" opacity="0.35"/>
      <rect x="-40" y="-3" width="13" height="6" rx="1" fill="#C85F34" stroke="#2B2118" stroke-width="2"/>
      <rect x="27" y="-3" width="13" height="6" rx="1" fill="#C85F34" stroke="#2B2118" stroke-width="2"/>
      <g fill="#C85F34" stroke="#2B2118" stroke-width="2">
        <rect x="-23" y="22" width="8" height="16">
          <animate attributeName="y" values="22;19;22" dur="0.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="-10" y="22" width="8" height="16">
          <animate attributeName="y" values="19;22;19" dur="0.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="3" y="22" width="8" height="16">
          <animate attributeName="y" values="22;19;22" dur="0.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="16" y="22" width="8" height="16">
          <animate attributeName="y" values="19;22;19" dur="0.3s" repeatCount="indefinite"/>
        </rect>
      </g>
      <rect x="-30" y="-20" width="60" height="44" rx="2" fill="#D2693A" stroke="#2B2118" stroke-width="2.5"/>
      <rect x="-15" y="-9" width="6" height="13" rx="1" fill="#2B2118"/>
      <rect x="9" y="-9" width="6" height="13" rx="1" fill="#2B2118"/>
    </g>
  </defs>

  <rect width="1200" height="160" fill="#EFE7D4"/>
  <rect width="1200" height="160" filter="url(#paper)"/>

  <g filter="url(#wobble)">
    <path d="M20 108 H1180" stroke="#2B2118" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>

    <!-- trail of stars -->
    <g fill="#E9B949" stroke="#2B2118" stroke-width="1.2" stroke-linejoin="round">
      <path d="M0 -8 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z" transform="translate(0 40)">
        <animateTransform attributeName="transform" type="translate" values="-20 40;1220 40" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -8 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z">
        <animateTransform attributeName="transform" type="translate" values="-20 40;1220 40" dur="9s" begin="3s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -8 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z">
        <animateTransform attributeName="transform" type="translate" values="-20 40;1220 40" dur="9s" begin="6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Clawd walking -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-60 70;1260 70" dur="9s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="0.6s" repeatCount="indefinite"/>
        <use href="#clawd-mini"/>
      </g>
    </g>

    <text x="600" y="145" text-anchor="middle" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-size="16" fill="#6B5B47">hand-painted with a little help from Claude · Clawd art by JohnHeibel (MIT)</text>
  </g>
</svg>
